<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="sciBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b192c" />
      <stop offset="60%" stop-color="#111c34" />
      <stop offset="100%" stop-color="#18274c" />
    </linearGradient>
    <linearGradient id="sciAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <pattern id="sciGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.25" />
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#sciBg)" />
  <rect width="800" height="450" fill="url(#sciGrid)" />

  <circle cx="700" cy="110" r="160" fill="none" stroke="#6366f1" stroke-width="1" stroke-opacity="0.15" />
  <circle cx="700" cy="110" r="240" fill="none" stroke="#818cf8" stroke-width="0.75" stroke-opacity="0.1" />

  <g transform="translate(60, 50)">
    <rect width="210" height="32" rx="16" fill="#6366f1" fill-opacity="0.18" stroke="#818cf8" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="18" cy="16" r="4" fill="#818cf8" />
    <text x="32" y="21" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1">CIÊNCIA &amp; ESPAÇO</text>
  </g>

  <g transform="translate(60, 140)">
    <rect x="0" y="0" width="72" height="72" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <!-- Atom / Orbit Icon -->
    <ellipse cx="36" cy="36" rx="20" ry="8" fill="none" stroke="#818cf8" stroke-width="2" transform="rotate(30 36 36)" />
    <ellipse cx="36" cy="36" rx="20" ry="8" fill="none" stroke="#818cf8" stroke-width="2" transform="rotate(-30 36 36)" />
    <circle cx="36" cy="36" r="4" fill="#818cf8" />

    <text x="96" y="32" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" letter-spacing="-0.5">DESCOBERTAS &amp; PESQUISA</text>
    <text x="96" y="60" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500">Avanços biomédicos, astrofísica, genômica e transição energética</text>
  </g>

  <g transform="translate(60, 340)">
    <rect width="680" height="1" fill="#334155" fill-opacity="0.6" />
    <text x="0" y="36" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" letter-spacing="0.5">METODOLOGIA CIENTÍFICA • REVISÃO POR PARES</text>
    <text x="680" y="36" text-anchor="end" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">ANTI-FEED AI</text>
  </g>

  <rect x="0" y="444" width="800" height="6" fill="url(#sciAccent)" />
</svg>
