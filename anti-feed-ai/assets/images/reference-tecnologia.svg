<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="techBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b192c" />
      <stop offset="60%" stop-color="#0f213a" />
      <stop offset="100%" stop-color="#183252" />
    </linearGradient>
    <linearGradient id="techAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <pattern id="techGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.25" />
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#techBg)" />
  <rect width="800" height="450" fill="url(#techGrid)" />

  <circle cx="700" cy="100" r="160" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.15" />
  <circle cx="700" cy="100" r="240" fill="none" stroke="#0284c7" stroke-width="0.75" stroke-opacity="0.1" />

  <g transform="translate(60, 50)">
    <rect width="210" height="32" rx="16" fill="#0284c7" fill-opacity="0.18" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="18" cy="16" r="4" fill="#38bdf8" />
    <text x="32" y="21" fill="#7dd3fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1">TECNOLOGIA &amp; IA</text>
  </g>

  <g transform="translate(60, 140)">
    <rect x="0" y="0" width="72" height="72" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <!-- Microchip / Circuit Icon -->
    <rect x="22" y="22" width="28" height="28" rx="4" fill="none" stroke="#38bdf8" stroke-width="2.5" />
    <circle cx="36" cy="36" r="5" fill="#38bdf8" />
    <path d="M14 28 h8 M14 36 h8 M14 44 h8 M50 28 h8 M50 36 h8 M50 44 h8 M28 14 v8 M36 14 v8 M44 14 v8 M28 50 v8 M36 50 v8 M44 50 v8" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />

    <text x="96" y="32" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" letter-spacing="-0.5">INOVAÇÃO &amp; PLATAFORMAS</text>
    <text x="96" y="60" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500">Desenvolvimento de IA, regulação digital e grandes empresas tech</text>
  </g>

  <g transform="translate(60, 340)">
    <rect width="680" height="1" fill="#334155" fill-opacity="0.6" />
    <text x="0" y="36" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" letter-spacing="0.5">SISTEMAS • COMPUTAÇÃO • IMPACTO ECONÔMICO</text>
    <text x="680" y="36" text-anchor="end" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">ANTI-FEED AI</text>
  </g>

  <rect x="0" y="444" width="800" height="6" fill="url(#techAccent)" />
</svg>
