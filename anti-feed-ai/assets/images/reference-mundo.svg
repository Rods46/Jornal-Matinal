<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="worldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b192c" />
      <stop offset="60%" stop-color="#112437" />
      <stop offset="100%" stop-color="#153654" />
    </linearGradient>
    <linearGradient id="worldAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <pattern id="worldGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.25" />
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#worldBg)" />
  <rect width="800" height="450" fill="url(#worldGrid)" />

  <circle cx="700" cy="110" r="160" fill="none" stroke="#0ea5e9" stroke-width="1" stroke-opacity="0.15" />
  <circle cx="700" cy="110" r="240" fill="none" stroke="#38bdf8" stroke-width="0.75" stroke-opacity="0.1" />

  <g transform="translate(60, 50)">
    <rect width="230" height="32" rx="16" fill="#0ea5e9" fill-opacity="0.18" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="18" cy="16" r="4" fill="#38bdf8" />
    <text x="32" y="21" fill="#7dd3fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1">GEOPOLÍTICA GLOBAL</text>
  </g>

  <g transform="translate(60, 140)">
    <rect x="0" y="0" width="72" height="72" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <!-- Globe Icon -->
    <circle cx="36" cy="36" r="18" fill="none" stroke="#38bdf8" stroke-width="2.5" />
    <ellipse cx="36" cy="36" rx="8" ry="18" fill="none" stroke="#38bdf8" stroke-width="2" />
    <line x1="18" y1="36" x2="54" y2="36" stroke="#38bdf8" stroke-width="2" />

    <text x="96" y="32" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" letter-spacing="-0.5">CENÁRIO INTERNACIONAL</text>
    <text x="96" y="60" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500">Tratados, diplomacia, comércio exterior e acontecimentos globais</text>
  </g>

  <g transform="translate(60, 340)">
    <rect width="680" height="1" fill="#334155" fill-opacity="0.6" />
    <text x="0" y="36" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" letter-spacing="0.5">DIPLOMACIA • COMÉRCIO GLOBAL • ACORDOS BILATERAIS</text>
    <text x="680" y="36" text-anchor="end" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">ANTI-FEED AI</text>
  </g>

  <rect x="0" y="444" width="800" height="6" fill="url(#worldAccent)" />
</svg>
