<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071220" />
      <stop offset="50%" stop-color="#0c1a2f" />
      <stop offset="100%" stop-color="#162942" />
    </linearGradient>
    <linearGradient id="goldTeal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="60%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <pattern id="heroGrid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#334155" stroke-width="0.8" stroke-opacity="0.22" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#heroBg)" />
  <rect width="1200" height="675" fill="url(#heroGrid)" />

  <!-- Abstract Editorial Geometry -->
  <circle cx="1060" cy="140" r="280" fill="none" stroke="#0d9488" stroke-width="1.5" stroke-opacity="0.18" />
  <circle cx="1060" cy="140" r="420" fill="none" stroke="#14b8a6" stroke-width="1" stroke-opacity="0.1" />
  <circle cx="140" cy="560" r="300" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.08" />

  <!-- Top Banner / Badge -->
  <g transform="translate(80, 80)">
    <rect width="280" height="38" rx="19" fill="#0d9488" fill-opacity="0.2" stroke="#14b8a6" stroke-width="1.2" stroke-opacity="0.5" />
    <circle cx="22" cy="19" r="5" fill="#2dd4bf" />
    <text x="38" y="24" fill="#2dd4bf" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" letter-spacing="1.2">DESTAQUE PRINCIPAL DO DIA</text>
  </g>

  <!-- Editorial Headline Box -->
  <g transform="translate(80, 220)">
    <!-- Heraldic Editorial Badge -->
    <rect x="0" y="0" width="100" height="100" rx="22" fill="#1e293b" stroke="#334155" stroke-width="2" />
    <path d="M30 35 h40 M30 50 h40 M30 65 h24 M62 65 h8" stroke="#14b8a6" stroke-width="4" stroke-linecap="round" />
    <polygon points="50,15 54,23 62,23 56,28 58,36 50,31 42,36 44,28 38,23 46,23" fill="#2dd4bf" />

    <!-- Text Block -->
    <text x="130" y="42" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="40" font-weight="900" letter-spacing="-1">MANCHETE MATINAL</text>
    <text x="130" y="80" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="500">Acontecimento de maior impacto e repercussão estratégica</text>
  </g>

  <!-- Verification Meta Footer -->
  <g transform="translate(80, 520)">
    <rect width="1040" height="1.5" fill="#334155" fill-opacity="0.7" />
    <g transform="translate(0, 35)">
      <circle cx="10" cy="0" r="10" fill="#0d9488" fill-opacity="0.2" />
      <path d="M6 -1 L9 3 L14 -3" fill="none" stroke="#2dd4bf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      <text x="30" y="5" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600">Apuração editorial com fontes primárias cruzadas</text>
      <text x="1040" y="5" text-anchor="end" fill="#14b8a6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">ANTI-FEED AI • AZURE FOUNDRY</text>
    </g>
  </g>

  <!-- Gradient Accent Bottom Border -->
  <rect x="0" y="667" width="1200" height="8" fill="url(#goldTeal)" />
</svg>
