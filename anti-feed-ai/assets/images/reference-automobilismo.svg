<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="autoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b192c" />
      <stop offset="60%" stop-color="#1f1828" />
      <stop offset="100%" stop-color="#341b2e" />
    </linearGradient>
    <linearGradient id="autoAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    <pattern id="autoGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.25" />
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#autoBg)" />
  <rect width="800" height="450" fill="url(#autoGrid)" />

  <circle cx="690" cy="110" r="160" fill="none" stroke="#ef4444" stroke-width="1" stroke-opacity="0.15" />
  <circle cx="690" cy="110" r="240" fill="none" stroke="#f97316" stroke-width="0.75" stroke-opacity="0.1" />

  <g transform="translate(60, 50)">
    <rect width="250" height="32" rx="16" fill="#ef4444" fill-opacity="0.18" stroke="#f97316" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="18" cy="16" r="4" fill="#f97316" />
    <text x="32" y="21" fill="#fdba74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1">AUTOMOBILISMO &amp; F1</text>
  </g>

  <g transform="translate(60, 140)">
    <rect x="0" y="0" width="72" height="72" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <!-- Speedometer / Track Flag Icon -->
    <path d="M22 46 A18 18 0 1 1 50 46" fill="none" stroke="#f97316" stroke-width="3" stroke-linecap="round" />
    <line x1="36" y1="36" x2="44" y2="28" stroke="#ef4444" stroke-width="3" stroke-linecap="round" />
    <circle cx="36" cy="36" r="3" fill="#f97316" />

    <text x="96" y="32" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" letter-spacing="-0.5">ESPORTE A MOTOR</text>
    <text x="96" y="60" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500">Fórmula 1, MotoGP, regulamentos técnicos e bastidores do paddock</text>
  </g>

  <g transform="translate(60, 340)">
    <rect width="680" height="1" fill="#334155" fill-opacity="0.6" />
    <text x="0" y="36" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" letter-spacing="0.5">CIRCUITOS • TELEMETRIA • ENGENHARIA AUTOMOTIVA</text>
    <text x="680" y="36" text-anchor="end" fill="#f97316" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">ANTI-FEED AI</text>
  </g>

  <rect x="0" y="444" width="800" height="6" fill="url(#autoAccent)" />
</svg>
