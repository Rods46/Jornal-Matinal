<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="spBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b192c" />
      <stop offset="60%" stop-color="#1f2334" />
      <stop offset="100%" stop-color="#2d334d" />
    </linearGradient>
    <linearGradient id="spAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#facc15" />
    </linearGradient>
    <pattern id="spGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.25" />
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#spBg)" />
  <rect width="800" height="450" fill="url(#spGrid)" />

  <circle cx="700" cy="110" r="160" fill="none" stroke="#eab308" stroke-width="1" stroke-opacity="0.15" />
  <circle cx="700" cy="110" r="240" fill="none" stroke="#facc15" stroke-width="0.75" stroke-opacity="0.1" />

  <g transform="translate(60, 50)">
    <rect width="250" height="32" rx="16" fill="#eab308" fill-opacity="0.18" stroke="#facc15" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="18" cy="16" r="4" fill="#facc15" />
    <text x="32" y="21" fill="#fef08a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1">ESPORTES &amp; RENDIMENTO</text>
  </g>

  <g transform="translate(60, 140)">
    <rect x="0" y="0" width="72" height="72" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <!-- Trophy Icon -->
    <path d="M24 24 h24 v14 a12 12 0 0 1 -24 0 Z M36 38 v10 M28 48 h16 M24 26 h-6 a4 4 0 0 1 -4 -4 v-2 a4 4 0 0 1 4 -4 h6 M48 26 h6 a4 4 0 0 0 4 -4 v-2 a4 4 0 0 0 -4 -4 h-6" fill="none" stroke="#facc15" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

    <text x="96" y="32" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" letter-spacing="-0.5">COMPETIÇÕES &amp; RODADA</text>
    <text x="96" y="60" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500">Resultados, análises táticas e grandes eventos esportivos</text>
  </g>

  <g transform="translate(60, 340)">
    <rect width="680" height="1" fill="#334155" fill-opacity="0.6" />
    <text x="0" y="36" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" letter-spacing="0.5">CAMPEONATOS • DESEMPENHO ATLÉTICO • COBERTURA</text>
    <text x="680" y="36" text-anchor="end" fill="#facc15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">ANTI-FEED AI</text>
  </g>

  <rect x="0" y="444" width="800" height="6" fill="url(#spAccent)" />
</svg>
