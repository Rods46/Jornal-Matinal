<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="polBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b192c" />
      <stop offset="60%" stop-color="#192036" />
      <stop offset="100%" stop-color="#242c4b" />
    </linearGradient>
    <linearGradient id="polAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#a78bfa" />
    </linearGradient>
    <pattern id="polGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.25" />
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#polBg)" />
  <rect width="800" height="450" fill="url(#polGrid)" />

  <circle cx="710" cy="110" r="160" fill="none" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.15" />
  <circle cx="710" cy="110" r="240" fill="none" stroke="#a78bfa" stroke-width="0.75" stroke-opacity="0.1" />

  <g transform="translate(60, 50)">
    <rect width="230" height="32" rx="16" fill="#8b5cf6" fill-opacity="0.18" stroke="#a78bfa" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="18" cy="16" r="4" fill="#a78bfa" />
    <text x="32" y="21" fill="#c4b5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1">POLÍTICA &amp; REGULAÇÃO</text>
  </g>

  <g transform="translate(60, 140)">
    <rect x="0" y="0" width="72" height="72" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <!-- Pillars / Institutional Icon -->
    <path d="M18 52 h36 M20 48 h32 M24 48 v-24 M32 48 v-24 M40 48 v-24 M48 48 v-24 M20 24 h32 M36 16 L18 24 M36 16 L54 24" fill="none" stroke="#a78bfa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

    <text x="96" y="32" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" letter-spacing="-0.5">PODER PÚBLICO &amp; LEIS</text>
    <text x="96" y="60" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500">Decisões de governo, agências reguladoras e impactos institucionais</text>
  </g>

  <g transform="translate(60, 340)">
    <rect width="680" height="1" fill="#334155" fill-opacity="0.6" />
    <text x="0" y="36" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" letter-spacing="0.5">CONGRESSO • SUPREMO • MINISTÉRIOS • AGÊNCIAS</text>
    <text x="680" y="36" text-anchor="end" fill="#a78bfa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">ANTI-FEED AI</text>
  </g>

  <rect x="0" y="444" width="800" height="6" fill="url(#polAccent)" />
</svg>
